<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicare+ Doctor Registration</title>

    <link rel="stylesheet" href="../css/doctor-reg.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="container">

    <div class="form-card">

        <div class="header">
            <div class="icon">
                <i class="fa-solid fa-user-doctor"></i>
            </div>
            <h1>Doctor Registration</h1>
            <p>Register yourself on Medicare+ Healthcare Platform</p>
        </div>

        <form id="doctorForm">

            <!-- PERSONAL DETAILS -->
            <div class="section-title">
                <i class="fa-solid fa-id-card"></i>
                Personal Details
            </div>

            <div class="row">
                <div class="input-group">
                    <label>First Name</label>
                    <input type="text" required>
                </div>

                <div class="input-group">
                    <label>Last Name</label>
                    <input type="text" required>
                </div>
            </div>

            <div class="row">
                <div class="input-group">
                    <label>Date of Birth</label>
                    <input type="date" required>
                </div>

                <div class="input-group">
                    <label>Contact Number</label>
                    <input type="tel"
                        placeholder="+91 XXXXX XXXXX"
                        required>
                </div>
            </div>

            <div class="row">
                <div class="input-group">
                    <label>Email ID</label>
                    <input type="email"
                        placeholder="doctor@example.com"
                        required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password"
                        placeholder="Enter Password"
                        required>
                </div>
            </div>

            <!-- EDUCATIONAL DETAILS -->
            <div class="section-title">
                <i class="fa-solid fa-graduation-cap"></i>
                Educational Details
            </div>

            <div class="row">

                <div class="input-group">
                    <label>Qualification</label>

                    <select required>
                        <option value="">Select Degree</option>
                        <option>MBBS</option>
                        <option>MD</option>
                        <option>MS</option>
                        <option>DM</option>
                        <option>MCh</option>
                        <option>BDS</option>
                        <option>MDS</option>
                        <option>BHMS</option>
                        <option>BAMS</option>
                        <option>BUMS</option>
                        <option>BNYS</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Upload Degree Certificate</label>
                    <input type="file"
                        class="file-input"
                        accept=".pdf,.jpg,.jpeg,.png">
                    <small>Max Size: 30 MB</small>
                </div>

            </div>

            <div class="row">

                <div class="input-group">
                    <label>Specialization</label>
                    <input type="text"
                        placeholder="Cardiology, Neurology, etc."
                        required>
                </div>

                <div class="input-group">
                    <label>Medical License Number</label>
                    <input type="text"
                        placeholder="License Number"
                        required>
                </div>

            </div>

            <div class="row">

                <div class="input-group">
                    <label>Upload License Document</label>
                    <input type="file"
                        class="file-input"
                        accept=".pdf,.jpg,.jpeg,.png">
                    <small>Max Size: 30 MB</small>
                </div>

                <div class="input-group">
                    <label>Experience</label>

                    <select required>
                        <option value="">Select Experience</option>
                        <option>0 - 1 Years (Fresher)</option>
                        <option>1 - 5 Years</option>
                        <option>6 - 10 Years</option>
                        <option>11 - 15 Years</option>
                        <option>16 - 20 Years</option>
                        <option>20+ Years</option>
                    </select>
                </div>

            </div>

            <!-- WORK DETAILS -->
            <div class="section-title">
                <i class="fa-solid fa-hospital"></i>
                Working Details
            </div>

            <div class="row">

                <div class="input-group">
                    <label>Hospital / Clinic Name</label>
                    <input type="text"
                        placeholder="Hospital Name"
                        required>
                </div>

                <div class="input-group">
                    <label>Internship / Training Certificate (Optional)</label>
                    <input type="file"
                        class="file-input"
                        accept=".pdf,.jpg,.jpeg,.png">
                    <small>Max Size: 30 MB</small>
                </div>

            </div>

            <!-- BUTTONS -->
            <div class="button-group">

                <button type="submit" class="save-btn">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <a href="Doctor_Login.html">
                    Save
                    </a>
                </button>

                <button type="reset" class="reset-btn">
                    <i class="fa-solid fa-rotate-left"></i>
                    Reset
                </button>

            </div>

        </form>

    </div>

</div>

<script src="../js/doctor-register.js"></script>

</body>
</html>
